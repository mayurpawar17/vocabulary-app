name: vocabulary_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.2.5
  flutter_tts: ^4.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/flutterAppIcon.png"
  android: true
  ios: true
  
  # Optional: Ensures a full, clean look on modern Android adaptive shapes
  adaptive_icon_background: "#ffffff" # Or use an image path like "assets/icon/background.png"
  adaptive_icon_foreground: "assets/flutterAppIcon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
